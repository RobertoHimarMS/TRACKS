spring.application.name=TRACKS

spring.thymeleaf.cache=false
server.port=8080

# Errores en el Navegador (quitar en explotacion, solo para desarrollo y depuracion)
spring.web.error.include-exception=true
spring.web.error.include-stacktrace=always
spring.web.error.include-message=always

# Tiempo maximo definido en App de Sesion de usuario sin actividad
server.servlet.session.timeout=30m

# Seguimiento de sesiones por cookies, no por jidsession
# server.servlet.session.tracking-modes=cookie

# IMPORTANTE: Configuracion de la bse de datos
# spring.datasource.url=jdbc:mysql://localhost:3306/db_tracks
spring.datasource.url=jdbc:mysql://localhost:3306/db_tracks?useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=admin
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate config (ddl-auto es importante al empezar)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# No necesario (obsoleto desde 7.0)
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# No mantener abierta la conexion a base de datos durante la renderizacion de la vista
spring.jpa.open-in-view=false

# Configuracion de subida de archivos (multipart)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.enabled=true

# Limite de partes multipart para Tomcat 11+ (por defecto 10, muy bajo para formularios con muchos campos)
server.tomcat.max-http-form-post-size=50MB
server.tomcat.max-parameter-count=200
server.tomcat.max-part-count=200

# Curiosidad para ver todas las rutas en la consola al cargar appWeb
# logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=TRACE
# logging.level.org.springframework.web.servlet.handler.AbstractHandlerMethodMapping=TRACE

# Ruta externa para subida de imagenes (funciona en IDE y Tomcat externo en Windows)
 #upload.path=C:/TrackYours/uploads
# Ruta externa para subida de imagenes (Tomcat externo en Linux, entorno de produccion)
upload.path=/var/TrackYours/uploads

# Propiedad importante por error con el case sensitive en el nombre de tablas de BD, debe activarse paraq ue funcione en Linux
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl