spring.application.name=TRACKS

spring.thymeleaf.cache=false
server.port=8080

# Errores en el Navegador (quitar en explotacion, solo para desarrollo y depuracion)
spring.web.error.include-exception=true
spring.web.error.include-stacktrace=always
spring.web.error.include-message=always

# Tiempo maximo definido en App de Sesion de usuario sin actividad
server.servlet.session.timeout=30m

# Seguimiento de sesiones por cookies, no por jidsession
# server.servlet.session.tracking-modes=cookie

# IMPORTANTE: Configuracion de la bse de datos
spring.datasource.url=jdbc:mysql://localhost:3306/db_tracks
spring.datasource.username=admin
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate config (ddl-auto es importante al empezar)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# No necesario (obsoleto desde 7.0)
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# No mantener abierta la conexion a base de datos durante la renderizacion de la vista
spring.jpa.open-in-view=false 