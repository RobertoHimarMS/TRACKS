<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TrackYours • Editar Item</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
                integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
                crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="/assets/css/styles.css" />
</head>
<body>
  <nav class="navbar navbar-expand-lg sticky-top">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2 fw-semibold" href="/">
        <span class="brand-mark"><i class="fa-solid fa-person-running"></i></span>
        <span>TrackYours</span>
      </a>
      <div class="ms-auto">
        <button class="btn btn-accent btn-sm px-3" data-bs-toggle="modal" data-bs-target="#authModal"><i class="fa-solid fa-right-to-bracket me-1"></i> Log In</button>
      </div>
    </div>
  </nav>

  <main class="py-4 py-lg-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-9">
          <div class="feature-card p-4">
            <h1 class="h3 mb-4"><i class="fa-solid fa-pen-to-square me-2"></i>Editar Actividad/Publicación/Producto</h1>

            <div class="mb-4">
              <label class="form-label"><i class="fa-solid fa-tags me-1"></i> Tipo</label>
              <select class="form-select">
                <option><i class="fa-solid fa-person-running"></i> Actividad</option>
                <option><i class="fa-solid fa-newspaper"></i> Publicación</option>
                <option><i class="fa-solid fa-store"></i> Producto</option>
              </select>
            </div>

            <form action="/item/guardar" method="post" enctype="multipart/form-data">
              <div class="row g-3">
                <div class="col-md-3">
                  <label class="form-label">ID</label>
                  <input class="form-control" readonly value="--">
                </div>
                <div class="col-md-9">
                  <label class="form-label"><i class="fa-solid fa-heading me-1"></i> Nombre / Título</label>
                  <input class="form-control" name="titulo" required placeholder="Título del item">
                </div>
                <div class="col-12">
                  <label class="form-label"><i class="fa-solid fa-align-left me-1"></i> Descripción</label>
                  <textarea class="form-control" rows="4" name="descripcion" placeholder="Describe el item..."></textarea>
                </div>
                <div class="col-md-6">
                  <label class="form-label"><i class="fa-solid fa-calendar me-1"></i> Campo extra 1</label>
                  <input class="form-control" placeholder="fecha / precio / etc.">
                </div>
                <div class="col-md-6">
                  <label class="form-label"><i class="fa-solid fa-location-dot me-1"></i> Campo extra 2</label>
                  <input class="form-control" placeholder="lugar / modalidad / estado...">
                </div>
                <div class="col-12">
                  <label class="form-label"><i class="fa-solid fa-image me-1"></i> Imagen</label>
                  <input class="form-control" type="file" name="file">
                </div>
                <div class="col-12">
                  <label class="form-label me-3"><i class="fa-solid fa-heart-pulse me-1"></i> Modalidad (actividad)</label>
                  <div class="d-flex flex-wrap gap-3">
                    <div class="form-check">
                      <input class="form-check-input" type="radio" name="mod" id="m1">
                      <label class="form-check-label" for="m1"><i class="fa-solid fa-person-running me-1"></i> Running</label>
                    </div>
                    <div class="form-check">
                      <input class="form-check-input" type="radio" name="mod" id="m2">
                      <label class="form-check-label" for="m2"><i class="fa-solid fa-swimmer me-1"></i> Natación</label>
                    </div>
                    <div class="form-check">
                      <input class="form-check-input" type="radio" name="mod" id="m3">
                      <label class="form-check-label" for="m3"><i class="fa-solid fa-bicycle me-1"></i> Bicicleta</label>
                    </div>
                    <div class="form-check">
                      <input class="form-check-input" type="radio" name="mod" id="m4">
                      <label class="form-check-label" for="m4"><i class="fa-solid fa-person-hiking me-1"></i> Sendero</label>
                    </div>
                  </div>
                </div>
              </div>

              <div class="d-flex justify-content-end mt-4">
                <button class="btn btn-accent btn-lg" type="submit">
                  <i class="fa-solid fa-floppy-disk me-2"></i>Crear/Modificar
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div class="modal fade" id="authModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-sm modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title"><i class="fa-solid fa-right-to-bracket me-2"></i>Log in</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <form action="/login" method="post">
            <div class="mb-3"><label class="form-label">Usuario ID</label><input class="form-control" name="username"></div>
            <div class="mb-3"><label class="form-label">Contraseña</label><input class="form-control" type="password" name="password"></div>
            <button class="btn btn-accent w-100" type="submit"><i class="fa-solid fa-right-to-bracket me-1"></i> Entrar</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  <script src="/assets/js/app.js"></script>
</body>
</html>
