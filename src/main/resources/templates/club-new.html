<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TrackYours • Nuevo Club</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
                integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
                crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="/assets/css/styles.css" />
</head>
<body>
  <nav class="navbar navbar-expand-lg sticky-top">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2 fw-semibold" href="/">
        <span class="brand-mark"><i class="fa-solid fa-person-running"></i></span>
        <span>TrackYours</span>
      </a>
      <div class="ms-auto">
        <button class="btn btn-accent btn-sm px-3" data-bs-toggle="modal" data-bs-target="#authModal"><i class="fa-solid fa-right-to-bracket me-1"></i> Log In</button>
      </div>
    </div>
  </nav>

  <main class="py-4 py-lg-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <div class="feature-card p-4">
            <h1 class="h3 mb-4"><i class="fa-solid fa-building me-2"></i>Formulario Nuevo Club</h1>
            <form action="/club/solicitar" method="post">
              <div class="row g-3">
                <div class="col-12">
                  <label class="form-label">Nombre del Club</label>
                  <input class="form-control" name="nombre" required placeholder="Nombre del club deportivo">
                </div>
                <div class="col-md-6">
                  <label class="form-label">CIF</label>
                  <input class="form-control" name="cif" placeholder="B12345678">
                </div>
                <div class="col-md-6">
                  <label class="form-label">Código Postal</label>
                  <input class="form-control" name="cp" placeholder="28001">
                </div>
                <div class="col-12">
                  <label class="form-label">Dirección sede</label>
                  <input class="form-control" name="direccion" placeholder="Calle, número, ciudad">
                </div>
                <div class="col-12">
                  <label class="form-label">Descripción</label>
                  <textarea class="form-control" rows="3" name="descripcion" placeholder="Describe tu club..."></textarea>
                </div>
              </div>

              <hr class="my-4">

              <h2 class="h5 mb-3"><i class="fa-solid fa-user-gear me-2"></i>Datos del Gestor</h2>
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label">DNI</label>
                  <input class="form-control" name="dniGestor" required placeholder="12345678A">
                </div>
                <div class="col-md-6">
                  <label class="form-label">Contraseña</label>
                  <input class="form-control" type="password" name="password" required placeholder="••••••••">
                </div>
                <div class="col-md-7">
                  <label class="form-label">Email</label>
                  <input class="form-control" type="email" name="email" required placeholder="correo@ejemplo.com">
                </div>
                <div class="col-md-5">
                  <label class="form-label">Teléfono</label>
                  <input class="form-control" name="telefono" placeholder="+34 600 000 000">
                </div>
              </div>

              <div class="d-flex justify-content-end mt-4">
                <button class="btn btn-accent btn-lg" type="submit">
                  <i class="fa-solid fa-paper-plane me-2"></i>SOLICITAR ALTA
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div class="modal fade" id="authModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-sm modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title"><i class="fa-solid fa-right-to-bracket me-2"></i>Log in</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <form action="/login" method="post">
            <div class="mb-3"><label class="form-label">Usuario ID</label><input class="form-control" name="username"></div>
            <div class="mb-3"><label class="form-label">Contraseña</label><input class="form-control" type="password" name="password"></div>
            <button class="btn btn-accent w-100" type="submit"><i class="fa-solid fa-right-to-bracket me-1"></i> Entrar</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  <script src="/assets/js/app.js"></script>
</body>
</html>
