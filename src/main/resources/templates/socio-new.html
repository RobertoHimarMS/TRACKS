<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TrackYours • Alta Socio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
                integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
                crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="/assets/css/styles.css" />
</head>
<body>
  <nav class="navbar navbar-expand-lg sticky-top">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2 fw-semibold" href="/">
        <span class="brand-mark"><i class="fa-solid fa-person-running"></i></span>
        <span>TrackYours</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"><span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0 gap-lg-1">
          <li class="nav-item"><a class="nav-link" href="/"><i class="fa-solid fa-house me-1"></i> Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="/club"><i class="fa-solid fa-users me-1"></i> Mi Club</a></li>
        </ul>
        <div class="d-flex gap-2">
          <button class="btn btn-accent btn-sm px-3" data-bs-toggle="modal" data-bs-target="#authModal"><i class="fa-solid fa-right-to-bracket me-1"></i> Log In</button>
        </div>
      </div>
    </div>
  </nav>

  <main class="py-4 py-lg-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <div class="feature-card p-4">
            <div class="d-flex align-items-center gap-3 mb-4">
              <img src="/assets/img/club-placeholder.jpg" class="rounded-4" alt="Club" style="width:110px;height:80px;object-fit:cover;">
              <div>
                <h1 class="h3 mb-1"><i class="fa-solid fa-user-plus me-2"></i>Club BB</h1>
                <p class="text-body-secondary mb-0">Formulario Nuevo Socio</p>
              </div>
            </div>

            <form action="/socio/solicitar" method="post">
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label"><i class="fa-solid fa-id-card me-1"></i> DNI</label>
                  <input class="form-control" name="dni" required placeholder="12345678A">
                </div>
                <div class="col-md-6">
                  <label class="form-label"><i class="fa-solid fa-lock me-1"></i> Contraseña</label>
                  <input class="form-control" type="password" name="password" required placeholder="••••••••">
                </div>
                <div class="col-md-6">
                  <label class="form-label"><i class="fa-solid fa-user me-1"></i> Nombre</label>
                  <input class="form-control" name="nombre" required placeholder="Tu nombre">
                </div>
                <div class="col-md-6">
                  <label class="form-label"><i class="fa-solid fa-user me-1"></i> Apellidos</label>
                  <input class="form-control" name="apellidos" required placeholder="Tus apellidos">
                </div>
                <div class="col-12">
                  <label class="form-label"><i class="fa-solid fa-location-dot me-1"></i> Dirección</label>
                  <input class="form-control" name="direccion" placeholder="Calle, número, ciudad">
                </div>
                <div class="col-md-7">
                  <label class="form-label"><i class="fa-solid fa-envelope me-1"></i> Email</label>
                  <input class="form-control" type="email" name="email" placeholder="correo@ejemplo.com">
                </div>
                <div class="col-md-5">
                  <label class="form-label"><i class="fa-solid fa-phone me-1"></i> Teléfono</label>
                  <input class="form-control" name="telefono" placeholder="+34 600 000 000">
                </div>
              </div>

              <div class="form-check mt-4">
                <input class="form-check-input" type="checkbox" id="cuota" name="cuotaPagada">
                <label class="form-check-label" for="cuota">
                  <i class="fa-solid fa-money-check me-1"></i> ¿He pagado ya la cuota?
                </label>
              </div>

              <div class="d-flex justify-content-end mt-4">
                <button class="btn btn-accent btn-lg" type="submit">
                  <i class="fa-solid fa-paper-plane me-2"></i>SOLICITAR ALTA
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div class="modal fade" id="authModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-sm modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title"><i class="fa-solid fa-right-to-bracket me-2"></i>Log in</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <form action="/login" method="post">
            <div class="mb-3"><label class="form-label">Usuario ID</label><input class="form-control" name="username"></div>
            <div class="mb-3"><label class="form-label">Contraseña</label><input class="form-control" type="password" name="password"></div>
            <button class="btn btn-accent w-100" type="submit"><i class="fa-solid fa-right-to-bracket me-1"></i> Entrar</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  <script src="/assets/js/app.js"></script>
</body>
</html>
